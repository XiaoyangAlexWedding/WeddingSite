<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    body { padding-top: 0; }
    .nf-page { padding-top: 72px; min-height: calc(100vh - 220px); display: flex; align-items: center; }

<body>
  <nav class="nav scrolled">
    <a class="nav-mono" href="/" aria-label="返回首页" style="border-bottom:0;">X &amp; A</a>
  </nav>

  <main class="nf-page">
    <section style="width:100%; background: var(--bg-deep)">
      <div class="shell-narrow" style="text-align:center">
        <div class="eyebrow" style="text-align:center">A little lost</div>
        <h2 class="section-title">404</h2>
        <div class="section-title-cn">页 面 未 找 到</div>
        <p style="font-family:var(--font-cn); color:var(--ink-soft); margin-bottom:8px">抱歉，您访问的页面不存在。</p>

        <a class="btn btn-cn btn-red" href="/">返回首页 · Home</a>

      <div class="footer-names">晓扬 &amp; Alex</div>
      <div class="footer-meta" style="margin-top:8px">Xiaoyang Li &nbsp;·&nbsp; Alexander Joachim</div>
      <div class="footer-hash">#XiaoyangAndAlex</div>
    </div>
  </footer>

<script>
(function () {
  var path = location.pathname.toLowerCase().replace(/\/+$/, '');
  if (path === '/rsvp') {
    location.replace('/RSVP/' + location.search + location.hash);
  } else if (path === '/portland') {
    location.replace('/portland/' + location.hash);
  }
})();
</script>
