<body>
<header class="hero">
  <div class="eyebrow">Xiaoyang & Alex · October 17, 2026</div>
  <h1>Staff Handbook</h1>
  <p>A role-based day-of guide: what this team owns, where it fits in the wedding timeline, and which Family & Friend captains they hand off with.</p>
</header>
<main class="shell">
  <div class="controls">
    <div class="select-wrap"><label for="roleSelect">View role</label><select id="roleSelect"></select></div>
    <div class="plan-toggle" aria-label="Plan"><button id="standardBtn" class="active">Standard</button><button id="rainBtn">Rain</button></div>
    <button class="action-btn" id="refreshBtn" type="button">Refresh sheet</button>
    <button class="action-btn copy-action" id="copyBtn" type="button">Copy role link</button>
  </div>
  <div class="livebar"><div class="live-state"><span class="dot" id="liveDot"></span><span id="liveText">Loading…</span></div><div id="updatedText"></div></div>
  <div id="app"><div class="empty" style="margin-top:22px">Loading staff handbook…</div></div>
</main>

<script>
const CONFIG = {
  // Paste the /exec URL from the ONE unified Apps Script Web App here.
  // Keep ?handbook=staff at the end. Until then, the page uses the embedded preview snapshot.
  API_URL: 'https://script.google.com/macros/s/AKfycbxnVmZMMlis0Sz3hbmUn5pPKIH0ujjVJy_cUOedtUO5yDCwU93OJ4kX0E9Fl0VmTtXL/exec?handbook=staff',
  FAMILY_PERSON_PARAM: 'person',
  AUTO_REFRESH_MS: 5 * 60 * 1000
};

let DATA = null;
let ROLE_MODELS = [];
let currentPlan = new URLSearchParams(location.search).get('plan') || 'Standard';
let currentRole = new URLSearchParams(location.search).get('role') || '';
let currentTab = new URLSearchParams(location.search).get('tab') || 'timeline';
if(currentTab==='assignments' || currentTab==='master') currentTab='timeline';
const VALID_TABS = ['timeline','additional','docs','captains'];
if(!VALID_TABS.includes(currentTab)) currentTab='timeline';
let currentMomentMode = new URLSearchParams(location.search).get('moments') || 'role';
if(!['role','key','all'].includes(currentMomentMode)) currentMomentMode='role';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
const norm = s => String(s ?? '').trim().toLowerCase();

function minutes(t){
  if(!t) return 99999;
  const s=String(t).trim().toUpperCase();
  if(s.includes('TBD') || s.includes('#REF')) return 99998;
  let m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/);
  if(!m) return 99997;
  let h=+m[1], min=+(m[2]||0); if(m[3]==='PM'&&h!==12)h+=12;if(m[3]==='AM'&&h===12)h=0;return h*60+min;
}
function uniq(items,keyFn){const seen=new Set();return items.filter(x=>{const k=keyFn(x);if(seen.has(k))return false;seen.add(k);return true})}
function categoryForContact(c){
  const a=norm(c.assignment);
  // Match the person's functional role before venue words that may simply appear
  // inside a route/assignment description (for example “DJ at Lan Su”).
  if(/command center|coordinator\s+assistant|coordinator\s+assitant/.test(a)) return 'Coordinator';
  if(/\bdj\b/.test(a)) return 'DJ';
  if(/cater|cheryl/.test(a)) return 'Catering';
  if(/photo/.test(a)) return 'Photographer';
  if(/video/.test(a)) return 'Videographer';
  if(/officiant/.test(a)) return 'Officiant';
  if(/make\s*up|makeup|hair/.test(a)) return 'Hair & Makeup';
  if(/bus|transport/.test(a)) return 'Transportation';
  if(/hotel/.test(a)) return 'Hotel';
  if(/^coordinator\b/.test(a)) return 'Coordinator';
  if(/providence|lan\s*su|lansu|venue/.test(a)) return 'Venue';
  return c.assignment || 'Staff / Vendor';
}

function chooseMasterForTask(t,masterEvents){
  const all=masterEvents||[];
  const ref=parseSourceRef(t.source);
  const taskEvent=String(t.eventId||'').trim();
  const taskPlan=String(t.plan||'').trim();

  // A source-row reference is trusted only when it still points to the same Event ID.
  if(ref){
    const exact=all.find(e=>e.row===ref.row && e.plan===ref.plan);
    if(exact && (!taskEvent || String(exact.eventId||'').trim()===taskEvent)) return exact;
  }

  // Event ID is the authoritative join key.  If the same Event ID occurs more
  // than once, use the matching plan and the moment closest to the Staff Task time.
  if(taskEvent){
    let candidates=all.filter(e=>String(e.eventId||'').trim()===taskEvent);
    const samePlan=candidates.filter(e=>!taskPlan || e.plan===taskPlan);
    if(samePlan.length) candidates=samePlan;
    if(candidates.length){
      const tm=minutes(t.time);
      return candidates.slice().sort((a,b)=>{
        const da=Math.abs(minutes(a.time)-tm);
        const db=Math.abs(minutes(b.time)-tm);
        if(Number.isFinite(da) && Number.isFinite(db) && da!==db) return da-db;
        return (a.row||99999)-(b.row||99999);
      })[0];
    }
  }

  // Last-resort fallback for legacy rows that have no Event ID.
  if(ref) return all.find(e=>e.row===ref.row && e.plan===ref.plan) || null;
  return null;
}
function buildMergedTimeline(masterEvents,tasks){
  const items=(masterEvents||[]).map(e=>({
    master:e,tasks:[],time:e.time||'',eventId:e.eventId||'',sortRow:e.row||99999
  }));
  const itemByMaster=new Map(items.map(i=>[i.master,i]));
  const unmatched=[];

  (tasks||[]).forEach(t=>{
    const chosen=chooseMasterForTask(t,masterEvents);
    if(chosen && itemByMaster.has(chosen)){
      itemByMaster.get(chosen).tasks.push(t);
    }else{
      unmatched.push(t);
    }
  });

  items.forEach(i=>{
    i.tasks.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')) || (a.row||0)-(b.row||0));
    if(i.tasks.length && !i.time) i.time=i.tasks[0].time||'';
  });

  const groups=new Map();
  unmatched.forEach(t=>{
    const key=[t.time||'',t.eventId||'',t.venue||'',t.location||''].join('|');
    if(!groups.has(key)) groups.set(key,{master:null,tasks:[],time:t.time||'',eventId:t.eventId||'',sortRow:t.row||99999});
    groups.get(key).tasks.push(t);
  });
  groups.forEach(g=>{
    g.tasks.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')) || (a.row||0)-(b.row||0));
    items.push(g);
  });

  return items.sort((a,b)=>minutes(a.time)-minutes(b.time) || (a.sortRow||99999)-(b.sortRow||99999) || String(a.eventId||'').localeCompare(String(b.eventId||'')));
}

      <div class="timeline ${currentMomentMode==='key'?'key-public-list':''}">${timeline.length?(currentMomentMode==='key'?timeline.map(renderKeyMoment).join(''):timeline.map(renderMergedMoment).join('')):`<div class="empty">No timeline moments are currently mapped to ${esc(model.role)} for this plan.</div>`}</div></section>
    </div>

    ${hasAdditional?`<div class="tab-panel" data-panel="additional" role="tabpanel">
      <section class="section"><div class="section-head"><div><div class="section-kicker">Role-specific reference</div><h2>Additional timeline</h2><div class="section-sub">Supporting source tabs such as Photo Timeline or Hair & Makeup Timeline are shown here when relevant to this role.</div></div></div>${model.additional.map(renderAdditional).join('')}</section>
    </div>`:''}

    <div class="tab-panel" data-panel="docs" role="tabpanel">
      <section class="section"><div class="section-head"><div><div class="section-kicker">Role reference library</div><h2>Detailed Docs</h2><div class="section-sub">Live references from the <b>Doc Details</b> tab for this staff role, separated into working documents and venue / setup video tours.</div></div></div>
      ${(()=>{
        const documents=(model.docs||[]).filter(d=>!(norm(d.type)==='video' || /\.(mp4|mov|m4v|webm)$/i.test(d.label||'')));
        const videos=(model.docs||[]).filter(d=>norm(d.type)==='video' || /\.(mp4|mov|m4v|webm)$/i.test(d.label||''));
        return `<div class="doc-library-grid">
          <div class="doc-frame"><div class="doc-frame-head"><div><h3 class="doc-frame-title">Detailed Documents</h3><div class="doc-frame-sub">Layouts, scripts, guides, and other role references.</div></div><span class="doc-frame-count">${documents.length}</span></div><div class="doc-grid">${documents.length?documents.map(renderDoc).join(''):`<div class="empty">No detailed documents are currently mapped to ${esc(model.role)}.</div>`}</div></div>
          <div class="doc-frame"><div class="doc-frame-head"><div><h3 class="doc-frame-title">Video Tours</h3><div class="doc-frame-sub">Venue, setup, and location walkthrough videos.</div></div><span class="doc-frame-count">${videos.length}</span></div><div class="doc-grid">${videos.length?videos.map(renderDoc).join(''):`<div class="empty">No video tours are currently mapped to ${esc(model.role)}.</div>`}</div></div>
        </div>`;
      })()}
      </section>
    </div>

    <div class="tab-panel" data-panel="captains" role="tabpanel">
      <section class="section"><div class="section-head"><div><div class="section-kicker">Human handoffs</div><h2>${(model.role==='Coordinator'||model.role==='Catering')?'Captains & staff/vendor contacts':'Family & Friend captains / collaborators'}</h2><div class="section-sub">${model.role==='Coordinator'?'Coordinator command-center view: every staff/vendor contact plus Family & Friend handoffs.':model.role==='Catering'?'Catering command-center view: every staff/vendor contact with food restrictions highlighted, plus Family & Friend handoffs.':'Operational Family & Friend roles sharing this team\'s Event IDs. Role-moment names jump here to the matching captain card.'}</div></div></div>
      ${(model.role==='Coordinator'||model.role==='Catering')?`<div class="handoff-grid"><div class="handoff-box"><h3 class="handoff-box-title">All Staff / Vendor Contacts</h3><p class="handoff-box-sub">Live directory from Groups&Contact, ordered by role first for fast day-of lookup.${model.role==='Catering'?' Food restrictions are highlighted here for catering use.':''}</p><div class="staff-directory">${(DATA.staffContacts||[]).length?[...(DATA.staffContacts||[])].sort((a,b)=>categoryForContact(a).localeCompare(categoryForContact(b))||String(a.assignment||'').localeCompare(String(b.assignment||''))||String(a.name||'').localeCompare(String(b.name||''))).map(c=>renderStaffDirectoryContact(c,model.role==='Catering')).join(''):`<div class="empty">No staff contacts found in Groups&Contact.</div>`}</div></div><div class="handoff-box"><h3 class="handoff-box-title">Family & Friend Captains</h3><p class="handoff-box-sub">People coordinating guest/family execution with this team, shown by role first.</p><div class="collab-grid">${model.collaborators.length?model.collaborators.slice().sort((a,b)=>String(a.role||'').localeCompare(String(b.role||''))||String(a.name||'').localeCompare(String(b.name||''))).map(renderCollab).join(''):`<div class="empty">No Family & Friend captain/collaborator is currently linked to ${esc(model.role)} Event IDs.</div>`}</div></div></div>`:`<div class="collab-grid">${model.collaborators.length?model.collaborators.slice().sort((a,b)=>String(a.role||'').localeCompare(String(b.role||''))||String(a.name||'').localeCompare(String(b.name||''))).map(renderCollab).join(''):`<div class="empty">No Family & Friend captain/collaborator is currently linked to this role's Event IDs.</div>`}</div>`}
      </section>
    </div>

    <footer class="source-footer">Live source: <strong>${esc(DATA.meta?.source||'Agenda- All in 1')}</strong> · Master Timeline · Staff Tasks · Roles · Groups&Contact · Doc Details · Make up Timeline · Photo Timeline.<br>Change the Google Sheet first; this page refreshes the data instead of maintaining a second schedule.</footer>`;

  document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>activateTab(btn.dataset.tab,true)));
  document.querySelectorAll('[data-moments]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.moments===currentMomentMode);btn.addEventListener('click',()=>{currentMomentMode=btn.dataset.moments;render()})});
  document.querySelectorAll('.internal-captain-link').forEach(link=>link.addEventListener('click',e=>{
    e.preventDefault();
    const target=link.dataset.captainTarget;
    activateTab('captains',false);
    requestAnimationFrame(()=>{
      const el=document.getElementById(target);
      if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('focus-flash');setTimeout(()=>el.classList.remove('focus-flash'),1600)}
      try{history.replaceState({},'',captainsTabLink({name:'',eventId:''}).split('#')[0]+'#'+target)}catch(_){}
    });
  }));
  activateTab(currentTab,false);
  if(location.hash && currentTab==='captains'){requestAnimationFrame(()=>{const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView({block:'center'})})}
}
function populateRoleSelect(){
  const s=$('#roleSelect');s.innerHTML='';ROLE_MODELS.forEach(m=>{const o=document.createElement('option');o.value=m.role;o.textContent=`${m.role} (${m.people.length})`;s.appendChild(o)}); if(!ROLE_MODELS.some(m=>m.role===currentRole))currentRole=ROLE_MODELS[0]?.role||'';s.value=currentRole;
}
function setLiveState(mode,message){
  $('#liveDot').className='dot'+(mode==='preview'?' preview':mode==='error'?' error':'');$('#liveText').textContent=message;$('#updatedText').textContent=DATA?.meta?.updatedAt?`Sheet read: ${DATA.meta.updatedAt}`:'';
}
function acceptData(payload,mode){
  if(!payload||payload.ok===false) throw new Error(payload?.error||'The data endpoint returned an error.'); DATA=payload;buildModels();populateRoleSelect();render();setLiveState(mode,mode==='live'?'Live from Google Sheet':'Preview mode · connect Apps Script URL for live updates');
}
function loadPreview(reason){
  const p=JSON.parse(document.getElementById('preview-data').textContent);acceptData(p,'preview'); if(reason)$('#updatedText').textContent=reason;
}
function loadData(){
  $('#refreshBtn').textContent='Refreshing…';
  const api=String(CONFIG.API_URL||'').trim();
  if(!api || api.includes('PASTE_YOUR_')){loadPreview('Preview snapshot · API URL not configured');$('#refreshBtn').textContent='Refresh sheet';return}
  const cb='staffHandbookCb_'+Date.now()+'_'+Math.floor(Math.random()*100000); const script=document.createElement('script'); const sep=api.includes('?')?'&':'?'; let done=false;
  const cleanup=()=>{if(script.parentNode)script.remove();try{delete window[cb]}catch(e){window[cb]=undefined}};
  const timer=setTimeout(()=>{if(done)return;done=true;cleanup();setLiveState('error','Live sheet timed out · live data unavailable');$('#refreshBtn').textContent='Refresh sheet'},15000);
  window[cb]=payload=>{if(done)return;done=true;clearTimeout(timer);cleanup();try{acceptData(payload,'live')}catch(err){setLiveState('error','Live sheet error: '+err.message)}finally{$('#refreshBtn').textContent='Refresh sheet'}};
  script.onerror=()=>{if(done)return;done=true;clearTimeout(timer);cleanup();setLiveState('error','Unable to load live wedding data. Please refresh or check your connection.');$('#refreshBtn').textContent='Refresh sheet'};
  script.src=api+sep+'callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(script);
}
$('#roleSelect').addEventListener('change',e=>{currentRole=e.target.value;render();scrollTo({top:0,behavior:'smooth'})});
$('#standardBtn').onclick=()=>{currentPlan='Standard';render()};$('#rainBtn').onclick=()=>{currentPlan='Rain';render()};$('#refreshBtn').onclick=loadData;
$('#copyBtn').onclick=async()=>{updateURL();try{await navigator.clipboard.writeText(location.href);$('#copyBtn').textContent='Link copied';setTimeout(()=>$('#copyBtn').textContent='Copy role link',1300)}catch(e){prompt('Copy this link:',location.href)}};
loadData();setInterval(()=>{if(!document.hidden)loadData()},CONFIG.AUTO_REFRESH_MS);
</script>
</body>
</html>
