<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rebecca & Alex · Staff Handbook</title>
<meta name="description" content="Live role-based day-of handbook for Rebecca & Alex's wedding staff and vendors." />
<style>
:root{
  --text:#3f3933; --muted:#746d65; --label:#81786e;
  --paper:#fbf7ef; --soft:#f7f0e7; --line:#e5dacd; --line-strong:#d4c3b2;
  --terracotta:#a55b45; --terracotta-soft:#f4e4db;
  --olive:#707a62; --olive-soft:#edf0e8;
  --warn:#84591f; --warn-bg:#fff0d6; --ok:#5c7756;
  --rain:#596c7d; --rain-bg:#e8eef3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--terracotta);text-underline-offset:2px}
button,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.k{font-weight:650;color:var(--label)}
.mini-label,.kicker{font-size:.73rem;font-weight:800;letter-spacing:.075em;text-transform:uppercase;color:var(--label)}
.muted{color:var(--muted)}

/* Compact PR #23-style masthead */
.topbar{background:var(--soft);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:3px 16px;padding-top:12px;padding-bottom:12px}
.topbar-title{font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;font-weight:700;color:var(--terracotta)}
.topbar-meta{color:var(--muted);font-size:.88rem}

/* Simple controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-top:16px}
.field{display:flex;align-items:center;gap:8px;font-weight:650}
.field select{min-width:220px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;font-weight:650}
.plan-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.plan-toggle button{border:0;background:#fff;padding:8px 14px;font-weight:650;color:var(--muted);cursor:pointer}
.plan-toggle button+button{border-left:1px solid var(--line-strong)}
.plan-toggle button.active{background:var(--olive);color:#fff}
.link-btn{border:0;background:none;padding:2px;color:var(--terracotta);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.controls .copy-link{margin-left:auto}
.livebar{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;padding-top:8px;color:var(--muted);font-size:.84rem}
.livebar.is-error{color:#9a4439}
.dot{width:8px;height:8px;border-radius:50%;background:var(--olive);flex:0 0 auto}.dot.error{background:#b7625a}
#updatedText:not(:empty)::before{content:"· "}

/* Role summary: short and useful */
.role-head{padding:22px 0 20px}
.role-head h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;color:var(--terracotta);font-size:2.15rem;margin-top:2px}
.role-venue{margin-top:6px;color:var(--muted)}
.role-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;margin-top:16px}
.role-cols.single{grid-template-columns:1fr}
.contact-list{display:grid;gap:12px;margin-top:6px}
.role-cols.single .contact-list{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.person-role,.contact-role{color:var(--terracotta);font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:pre-line}
.person-name,.contact-name{font-weight:750;margin-top:2px}
.person-meta,.contact-links{margin-top:3px;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.dayof{background:var(--olive-soft);border:1px solid #dce2d4;border-radius:9px;padding:13px 15px}
.dayof .contact{margin-top:6px}

/* PR #23-style underline tabs */
.tabbar{position:sticky;top:0;z-index:10;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
.tabbar::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;border:0;border-bottom:3px solid transparent;background:none;padding:12px 11px 9px;font-weight:650;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--text);border-bottom-color:var(--terracotta)}
.tab-count{font-weight:500;color:var(--label);margin-left:2px}
.tab-panel{display:none;padding-top:20px}.tab-panel.active{display:block}
.panel-h{font-size:1.3rem}.panel-note{margin:7px 0 14px;color:var(--muted);font-size:.91rem}

/* Minimal segmented timeline switch */
.timeline-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin-bottom:10px}
.moment-switch{display:flex;flex-wrap:wrap;gap:6px}
.moment-switch button{border:1px solid var(--line-strong);border-radius:999px;background:#fff;padding:6px 11px;font-size:.88rem;font-weight:650;color:var(--muted);cursor:pointer}
.moment-switch button.active{background:var(--text);border-color:var(--text);color:#fff}
.timeline-hint{font-size:.82rem;color:var(--muted)}
.coordinator-person-tools{padding:10px 12px;margin-bottom:12px;background:var(--cream);border:1px solid var(--line);border-radius:10px}
.coordinator-person-switch button.active{background:var(--terracotta);border-color:var(--terracotta);color:#fff}

/* One clean schedule column */
.timeline{border-top:1px solid var(--line)}
.event{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line);background:transparent}
.event-time{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.event.role-moment .event-time{color:var(--terracotta)}
.event-body{min-width:0}
.event-label{display:flex;flex-wrap:wrap;gap:5px 9px;margin-bottom:4px;font-size:.76rem;font-weight:800;letter-spacing:.045em;text-transform:uppercase;color:var(--label)}
.event-label .mine{color:var(--terracotta)}
.rain-tag{letter-spacing:0;text-transform:none;font-size:.73rem;padding:1px 8px;border-radius:999px;background:var(--rain-bg);color:var(--rain)}
.event-title{font-weight:750;margin:0}

/* Role task: who left, where + status right */
.role-assignments{margin-top:8px}
.role-assignment{padding:10px 0}.role-assignment+.role-assignment{border-top:1px dashed var(--line);margin-top:6px;padding-top:13px}
.role-assignment-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px}
.role-assignment-person{font-size:.88rem;font-weight:750;color:var(--olive)}
.assignment-right{display:flex;align-items:center;justify-content:flex-end;gap:6px 10px;flex-wrap:wrap;text-align:right}
.role-assignment-place{font-size:.85rem;color:var(--muted);max-width:28em}
.role-assignment-duty{margin-top:5px;white-space:pre-line}
.badge{display:inline-block;font-size:.75rem;font-weight:750;line-height:1.3}
.badge.confirmed{color:var(--ok);white-space:nowrap}.badge.confirmed:before{content:"✓ "}
.badge.open{padding:2px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.badge.rain{padding:2px 8px;border-radius:999px;background:var(--rain-bg);color:var(--rain)}
.notes{margin-top:8px;padding:8px 11px;border-left:3px solid #d9bda0;background:#fcf7f0;font-size:.9rem;white-space:pre-line}
.discussion{margin-top:7px;padding:9px 11px;background:var(--soft);border-radius:8px;color:#625a52;font-size:.86rem;white-space:pre-line}

/* Captains inline, not chunky pills */
.moment-collabs{margin-top:9px;font-size:.86rem;color:var(--muted)}
.moment-collab-list{display:inline}.moment-collab-link{font-weight:650;text-decoration:none}.moment-collab-link+.moment-collab-link:before{content:", ";color:var(--muted);font-weight:400}.moment-collab-role{font-weight:400;color:var(--muted)}

/* The ONLY expanded context lives behind More details */
details.master-context,details.planning-note{margin-top:9px}
details.master-context>summary,details.planning-note>summary{cursor:pointer;color:var(--terracotta);font-weight:650;font-size:.88rem;width:max-content;max-width:100%}
.master-context-body{margin-top:8px;padding:11px 13px;background:var(--soft);border-radius:8px;font-size:.9rem}
.context-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px;align-items:start}
.context{min-width:0;overflow-wrap:anywhere}
.context b{display:block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--label);margin-bottom:4px}
.context div{white-space:pre-line}
.context-note{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.key-public .event-title{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;font-size:1.05rem}.key-public-meta{color:var(--muted);font-size:.8rem;margin-bottom:2px}
.vendor-lines{margin-top:4px;color:var(--muted);font-size:.92rem}.vendor-lines .hl{color:var(--text);font-weight:650}

/* Docs/additional references stay simple */
.doc-library-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.doc-frame{min-width:0}.doc-frame-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:5px}.doc-frame-title{font-size:1.05rem}.doc-frame-sub{color:var(--muted);font-size:.84rem}.doc-frame-count{font-size:.78rem;color:var(--label)}
.doc-grid{border-top:1px solid var(--line)}.doc-card{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}.doc-icon{flex:0 0 30px;width:30px;height:30px;display:grid;place-items:center;border-radius:7px;background:var(--soft);color:var(--terracotta)}.doc-copy b{display:block}.doc-meta{font-size:.83rem;color:var(--muted)}
.makeup-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.schedule-title{font-weight:750;margin-bottom:6px}.schedule-table-wrap{overflow-x:auto}.schedule-table{width:100%;border-collapse:collapse;font-size:.88rem}.schedule-table th{text-align:left;color:var(--label);font-size:.71rem;letter-spacing:.05em;text-transform:uppercase}.schedule-table th,.schedule-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.schedule-time{font-weight:700;white-space:nowrap}.schedule-marker{font-weight:750}.makeup-note{margin-top:8px;color:var(--muted);font-size:.82rem}.ref-card{margin-bottom:20px}.ref-card h3{font-size:1.05rem}.ref-list{border-top:1px solid var(--line);margin-top:6px}.ref-item{display:grid;grid-template-columns:55px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.ref-time{font-weight:750;color:var(--label)}.ref-main b{display:block}.ref-note{color:var(--muted);font-size:.85rem;margin-top:2px}
.transport-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.transport-group{min-width:0}.transport-group h3{font-size:1.05rem;margin-bottom:6px;color:var(--terracotta)}.transport-group .ref-list{margin-top:0}

/* Contacts: role first. Coordinator/Catering use two columns. */
.handoff-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}.handoff-box{min-width:0}.handoff-box-title{font-size:1.05rem;margin-bottom:3px}.handoff-box-sub{color:var(--muted);font-size:.84rem;margin:0 0 8px}
.staff-directory,.collab-grid{border-top:1px solid var(--line)}
.staff-contact-card,.collab{padding:13px 0;border-bottom:1px solid var(--line);background:transparent}
.staff-contact-role,.collab-role{display:block;color:var(--terracotta);font-size:.78rem;font-weight:800;letter-spacing:.045em;text-transform:uppercase;white-space:pre-line}
.staff-contact-name,.collab-name{font-weight:750;margin-top:2px}
.contact-links,.collab-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px}.contact-link,.pill-link{font-size:.84rem}.collab-meta{font-size:.84rem;color:var(--muted);margin-top:2px}.collab-duty{font-size:.9rem;margin-top:5px;white-space:pre-line}
.food-note{margin-top:8px;padding:8px 10px;border-left:3px solid #c58e55;background:#fff3de;color:#744d20;font-size:.88rem;font-weight:750}
.focus-flash{outline:3px solid #d6b67c;outline-offset:3px;transition:outline-color .3s ease}
.empty{padding:15px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--muted)}
.footer{margin:34px 0 44px;color:var(--label);font-size:.83rem}

@media(max-width:700px){
  .context-grid{grid-template-columns:1fr}
  .wrap{padding:0 16px}.field{flex:1 1 100%}.field select{flex:1;min-width:0}.controls .copy-link{margin-left:0}.role-head h1{font-size:1.75rem}.role-cols,.handoff-grid,.doc-library-grid,.makeup-grid,.transport-grid{grid-template-columns:1fr}.event{grid-template-columns:1fr;gap:2px;padding:14px 0}.role-assignment-top{grid-template-columns:1fr}.assignment-right{justify-content:flex-start;text-align:left}.role-assignment-place{max-width:none}.tab-btn{padding:12px 9px 9px;font-size:.93rem}.moment-switch button{font-size:.83rem;padding:5px 9px}
}
@media print{.controls,.livebar,.tabbar,.moment-switch,.link-btn,.pill-link{display:none!important}.tab-panel{display:block!important;padding-top:12px}.event,.collab,.staff-contact-card,.ref-item{break-inside:avoid}.wrap{max-width:none}.dayof{background:none;border:1px solid var(--line)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="topbar-title">Wedding Day Staff Handbook</div>
    <div class="topbar-meta">Xiaoyang &amp; Alex · Saturday, October 17, 2026</div>
  </div>
</header>
<main class="wrap">
  <div class="controls">
    <label class="field"><span>Role</span><select id="roleSelect"></select></label>
    <div class="plan-toggle" aria-label="Weather plan"><button id="standardBtn" class="active">Standard</button><button id="rainBtn">Rain plan</button></div>
    <button class="link-btn copy-link" id="copyBtn" type="button">Copy link</button>
  </div>
  <div class="livebar" id="liveBar"><span class="dot" id="liveDot"></span><span id="liveText">Loading…</span><span id="updatedText"></span><button class="link-btn" id="refreshBtn" type="button">Refresh</button></div>
  <div id="app"><div class="empty" style="margin-top:22px">Loading staff handbook…</div></div>
</main>

<script>
const CONFIG = {
  // Production: live source of truth is Agenda - All in 1 via the unified Apps Script Web App.
  // Keep ?handbook=staff at the end.
  API_URL: 'https://script.google.com/macros/s/AKfycbxnVmZMMlis0Sz3hbmUn5pPKIH0ujjVJy_cUOedtUO5yDCwU93OJ4kX0E9Fl0VmTtXL/exec?handbook=staff',
  FAMILY_PERSON_PARAM: 'person',
  AUTO_REFRESH_MS: 5 * 60 * 1000
};

let DATA = null;
let ROLE_MODELS = [];
let currentPlan = new URLSearchParams(location.search).get('plan') || 'Standard';
let currentRole = new URLSearchParams(location.search).get('role') || '';
let currentCoordinatorPerson = new URLSearchParams(location.search).get('coordinator') || 'all';
let currentTab = new URLSearchParams(location.search).get('tab') || 'timeline';
if(currentTab==='assignments' || currentTab==='master') currentTab='timeline';
const VALID_TABS = ['timeline','agenda','additional','docs','captains'];
if(!VALID_TABS.includes(currentTab)) currentTab='timeline';
// Keep each moment's expand/collapse choice during re-renders and live sheet refreshes.
// An unseen moment defaults to open.
const momentDetailsState = new Map();
let currentMomentMode = new URLSearchParams(location.search).get('moments') || 'role';
if(!['role','key','all'].includes(currentMomentMode)) currentMomentMode='role';
if(currentMomentMode==='key' && currentTab==='timeline') currentTab='agenda';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
const norm = s => String(s ?? '').trim().toLowerCase();
const clean = s => {
  const v=String(s ?? '').trim();
  return /^[\/\-–—]*$/.test(v)?'':v;
};
const firstLine = s => clean(s).split(/\r?\n/).map(x=>x.trim()).filter(Boolean)[0]||'';

function minutes(t){
  if(!t) return 99999;
  const s=String(t).trim().toUpperCase();
  if(s.includes('TBD') || s.includes('#REF')) return 99998;
  let m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/);
  if(!m) return 99997;
  let h=+m[1], min=+(m[2]||0); if(m[3]==='PM'&&h!==12)h+=12;if(m[3]==='AM'&&h===12)h=0;return h*60+min;
}
function uniq(items,keyFn){const seen=new Set();return items.filter(x=>{const k=keyFn(x);if(seen.has(k))return false;seen.add(k);return true})}
function categoryForContact(c){
  const a=norm(c.assignment);
  // Match the person's functional role before venue words that may simply appear
  // inside a route/assignment description (for example “DJ at Lan Su”).
  if(/command center|coordinator\s+assistant|coordinator\s+assitant/.test(a)) return 'Coordinator';
  if(/\bdj\b/.test(a)) return 'DJ';
  if(/cater|cheryl/.test(a)) return 'Catering';
  if(/photo/.test(a)) return 'Photographer';
  if(/video/.test(a)) return 'Videographer';
  if(/officiant/.test(a)) return 'Officiant';
  if(/make\s*up|makeup|hair/.test(a)) return 'Hair & Makeup';
  if(/bus|transport/.test(a)) return 'Transportation';
  if(/hotel/.test(a)) return 'Hotel';
  if(/^coordinator\b/.test(a)) return 'Coordinator';
  if(/providence|lan\s*su|lansu|venue/.test(a)) return 'Venue';
  return c.assignment || 'Staff / Vendor';
}
function roleSort(a,b){
  const order=['Coordinator','Catering','DJ','Photographer','Videographer','Officiant','Venue','Transportation','Hotel','Hair & Makeup'];
  const ai=order.indexOf(a.role), bi=order.indexOf(b.role);
  if(ai!==-1||bi!==-1) return (ai===-1?999:ai)-(bi===-1?999:bi);
  return a.role.localeCompare(b.role);
}
function parseSourceRef(source){
  const m=String(source||'').match(/Master Timeline!([A-Z]+)(\d+)/i); if(!m)return null;
  const col=m[1].toUpperCase(), row=+m[2];
  return {row, plan: col.charCodeAt(0)>=74?'Rain':'Standard'};
}
function masterMatchesDirectory(role,e){
  const text=norm([e.family,e.vendor,e.guest,e.key].filter(Boolean).join(' '));
  if(role==='Transportation') return /shuttle|transport|bus/.test(text);
  if(role==='Hotel') return /hotel/.test(text);
  if(role==='Hair & Makeup') return /makeup|hair|touch[- ]?up/.test(text);
  if(role==='Venue') return /providence|lan su|lansu|garden|chapel/.test(text);
  return false;
}
function isOperationalFamilyRole(r){
  const s=norm(r.role+' '+r.duty);
  return /captain|support|greeter|wrangler|keeper|monitor|usher|toast-giver|reader|food|belongings|music|recording|game|tea ceremony|transport|dress|attire|flower|ring boy|flower girl/.test(s);
}
function buildModels(){
  const map=new Map();
  const ensure=role=>{if(!map.has(role))map.set(role,{role,people:[],tasks:[],master:[],collaborators:[],additional:[],docs:[]});return map.get(role)};
  const contactByName=new Map((DATA.staffContacts||[]).map(c=>[norm(c.name),c]));

  (DATA.staffContacts||[]).forEach(c=>{
    const role=categoryForContact(c); const m=ensure(role);
    if(!m.people.some(p=>norm(p.name)===norm(c.name))) m.people.push(c);
  });
  (DATA.tasks||[]).forEach(t=>{
    const role=t.role||'Staff / Vendor', m=ensure(role); m.tasks.push(t);
    if(t.name && !m.people.some(p=>norm(p.name)===norm(t.name))){
      m.people.push(contactByName.get(norm(t.name)) || {name:t.name,assignment:role,phone:'',email:'',food:''});
    }
  });

  map.forEach(m=>{
    const docMap=DATA.docDetails||{};
    m.docs=Object.keys(docMap).filter(k=>norm(k)===norm(m.role)).flatMap(k=>docMap[k]||[]);
    m.docs=uniq(m.docs,d=>[d.label,d.url].join('|'));
    const eventIds=new Set(m.tasks.map(t=>t.eventId).filter(Boolean));
    const sourceRefs=m.tasks.map(t=>parseSourceRef(t.source)).filter(Boolean);
    m.master=(DATA.masterEvents||[]).filter(e=>{
      const exact=sourceRefs.some(r=>r.row===e.row && r.plan===e.plan);
      const byEvent=e.eventId && eventIds.has(e.eventId);
      return exact || byEvent || (!m.tasks.length && masterMatchesDirectory(m.role,e));
    });
    m.master=uniq(m.master,e=>[e.row,e.plan,e.eventId,e.time].join('|'));

    if(eventIds.size){
      m.collaborators=(DATA.familyRoles||[]).filter(r=>eventIds.has(r.eventId) && isOperationalFamilyRole(r));
      m.collaborators=uniq(m.collaborators,r=>[r.name,r.eventId,r.role,r.duty].join('|'));
    }

    const roleText=norm(m.role);
    if(/photo|video/.test(roleText) || (m.role==='Coordinator' && m.tasks.some(t=>/^PA0?9|PHOTO/i.test(t.eventId||'')))){
      if((DATA.photoTimeline||[]).length) m.additional.push({type:'photo',title:'Photo Timeline',items:DATA.photoTimeline});
    }
    if(/makeup|hair/.test(roleText)){
      if((DATA.makeupTimeline||[]).length) m.additional.push({type:'makeup',title:'Hair & Makeup Timeline',items:DATA.makeupTimeline});
    }
    if(/transport/.test(roleText)){
      if((DATA.transportationTimeline||[]).length) m.additional.push({type:'transportation',title:'Transportation',items:DATA.transportationTimeline});
    }
  });
  ROLE_MODELS=[...map.values()].sort(roleSort);
}
function taskVisible(t){
  if(currentPlan==='Standard') return !t.plan || t.plan==='Standard';
  if(t.plan==='Rain') return true;
  return t.plan==='Standard' && !/lan su/i.test(t.venue||'');
}
function masterVisible(e){
  if(currentPlan==='Standard') return e.plan==='Standard';
  if(/^PA|^RS/i.test(e.eventId||'')) return e.plan==='Standard';

function chooseMasterForTask(t,masterEvents){
  const all=masterEvents||[];
  const ref=parseSourceRef(t.source);
  const taskEvent=String(t.eventId||'').trim();
  const taskPlan=String(t.plan||'').trim();

  // A source-row reference is trusted only when it still points to the same Event ID.
  if(ref){
    const exact=all.find(e=>e.row===ref.row && e.plan===ref.plan);
    if(exact && (!taskEvent || String(exact.eventId||'').trim()===taskEvent)) return exact;
  }

  // Event ID is the authoritative join key.  If the same Event ID occurs more
  // than once, use the matching plan and the moment closest to the Staff Task time.
  if(taskEvent){
    let candidates=all.filter(e=>String(e.eventId||'').trim()===taskEvent);
    const samePlan=candidates.filter(e=>!taskPlan || e.plan===taskPlan);
    if(samePlan.length) candidates=samePlan;
    if(candidates.length){
      const tm=minutes(t.time);
      return candidates.slice().sort((a,b)=>{
        const da=Math.abs(minutes(a.time)-tm);
        const db=Math.abs(minutes(b.time)-tm);
        if(Number.isFinite(da) && Number.isFinite(db) && da!==db) return da-db;
        return (a.row||99999)-(b.row||99999);
      })[0];
    }
  }

  // Last-resort fallback for legacy rows that have no Event ID.
  if(ref) return all.find(e=>e.row===ref.row && e.plan===ref.plan) || null;
  return null;
}
function buildMergedTimeline(masterEvents,tasks){
  const items=(masterEvents||[]).map(e=>({
    master:e,tasks:[],time:e.time||'',eventId:e.eventId||'',sortRow:e.row||99999
  }));
  const itemByMaster=new Map(items.map(i=>[i.master,i]));
  const unmatched=[];

  (tasks||[]).forEach(t=>{
    const chosen=chooseMasterForTask(t,masterEvents);
    if(chosen && itemByMaster.has(chosen)){
      itemByMaster.get(chosen).tasks.push(t);
    }else{
      unmatched.push(t);
    }
  });

  items.forEach(i=>{
    i.tasks.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')) || (a.row||0)-(b.row||0));
    if(i.tasks.length && !i.time) i.time=i.tasks[0].time||'';
  });

  const groups=new Map();
  unmatched.forEach(t=>{
    const key=[t.time||'',t.eventId||'',t.venue||'',t.location||''].join('|');
    if(!groups.has(key)) groups.set(key,{master:null,tasks:[],time:t.time||'',eventId:t.eventId||'',sortRow:t.row||99999});
    groups.get(key).tasks.push(t);
  });
  groups.forEach(g=>{
    g.tasks.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')) || (a.row||0)-(b.row||0));
    items.push(g);
  });

  return items.sort((a,b)=>minutes(a.time)-minutes(b.time) || (a.sortRow||99999)-(b.sortRow||99999) || String(a.eventId||'').localeCompare(String(b.eventId||'')));
}

    </nav>

    <div class="tab-panel" data-panel="timeline" role="tabpanel">
      ${isCoord?`<div class="timeline-tools coordinator-person-tools"><div class="moment-switch coordinator-person-switch"><button type="button" data-coordinator-person="all">All Coordinator</button>${coordinatorPeople.map(name=>`<button type="button" data-coordinator-person="${esc(name)}">${esc(name)}</button>`).join('')}</div><div class="timeline-hint">${currentCoordinatorPerson==='all'?'Showing the full coordinator team.':`Showing only ${esc(currentCoordinatorPerson)}’s assignments.`}</div></div>`:''}
      <div class="timeline-tools"><div class="moment-switch"><button type="button" data-moments="role">${esc(model.role==='Coordinator'&&currentCoordinatorPerson!=='all'?currentCoordinatorPerson:model.role)} tasks · ${roleTimeline.length}</button><button type="button" data-moments="all">Full day · ${allTimeline.length}</button></div><div class="timeline-hint">${currentMomentMode==='all'?'Complete day; this role is highlighted.':(isCoord&&currentCoordinatorPerson!=='all'?`Only moments where ${esc(currentCoordinatorPerson)} has a task.`:`Only moments where ${esc(model.role)} has a task.`)}</div></div>
      <div class="timeline">${timeline.length?timeline.map(renderMergedMoment).join(''):`<div class="empty">No timeline moments are currently mapped to ${esc(isCoord&&currentCoordinatorPerson!=='all'?currentCoordinatorPerson:model.role)} for this plan.</div>`}</div>
    </div>

    <div class="tab-panel" data-panel="agenda" role="tabpanel">
      <h2 class="panel-h">Agenda</h2>
      <p class="panel-note">The main wedding-day moments for everyone: time, event, and venue only.</p>
      <div class="timeline key-public-list">${keyTimeline.length?keyTimeline.map(renderKeyMoment).join(''):'<div class="empty">No agenda moments are currently listed for this plan.</div>'}</div>
    </div>

    ${hasAdditional?`<div class="tab-panel" data-panel="additional" role="tabpanel"><h2 class="panel-h">${esc(additionalTabTitle)}</h2>${model.additional.map(renderAdditional).join('')}</div>`:''}

    <div class="tab-panel" data-panel="docs" role="tabpanel"><h2 class="panel-h">Documents & videos</h2><p class="panel-note">Live references from the Doc Details sheet.</p><div class="doc-library-grid"><div class="doc-frame"><div class="doc-frame-head"><div><h3 class="doc-frame-title">Documents</h3><div class="doc-frame-sub">Scripts, layouts and guides.</div></div><span class="doc-frame-count">${docs.length}</span></div><div class="doc-grid">${docs.length?docs.map(renderDoc).join(''):'<div class="empty">No documents mapped to this role.</div>'}</div></div><div class="doc-frame"><div class="doc-frame-head"><div><h3 class="doc-frame-title">Video tours</h3><div class="doc-frame-sub">Venue and setup walkthroughs.</div></div><span class="doc-frame-count">${vids.length}</span></div><div class="doc-grid">${vids.length?vids.map(renderDoc).join(''):'<div class="empty">No video tours mapped to this role.</div>'}</div></div></div></div>

    <div class="tab-panel" data-panel="captains" role="tabpanel">
      <h2 class="panel-h">All Contacts</h2>
      <div class="handoff-grid">
        <section class="handoff-box"><h3 class="handoff-box-title">All Staff / Vendor Contacts</h3><p class="handoff-box-sub">Role first for fast day-of lookup.${model.role==='Catering'?' Food restrictions and meal notes are highlighted for Catering.':''}</p><div class="staff-directory">${contacts.length?contacts.map(c=>renderStaffDirectoryContact(c,model.role==='Catering')).join(''):'<div class="empty">No staff contacts found.</div>'}</div></section>
        <section class="handoff-box"><h3 class="handoff-box-title">Family & Friend Captains</h3><p class="handoff-box-sub">Full operational captain directory. Schedule links jump to the matching person here.</p><div class="collab-grid">${allCaptains.length?allCaptains.map(renderCollab).join(''):'<div class="empty">No Family & Friend captains found.</div>'}</div></section>
      </div>
    </div>

    <footer class="footer">Live from Agenda - All in 1. Update the Google Sheet first; this page does not contain a second hardcoded wedding schedule.</footer>`;

  document.querySelectorAll('details.master-context').forEach(detail=>{
    detail.addEventListener('toggle',()=>momentDetailsState.set(detail.dataset.contextId,detail.open));
  });
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>activateTab(btn.dataset.tab,true)));
  document.querySelectorAll('[data-moments]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.moments===currentMomentMode);btn.addEventListener('click',()=>{currentMomentMode=btn.dataset.moments;render()})});
  document.querySelectorAll('[data-coordinator-person]').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.coordinatorPerson===currentCoordinatorPerson);
    btn.addEventListener('click',()=>{currentCoordinatorPerson=btn.dataset.coordinatorPerson||'all';currentMomentMode='role';render()});
  });
  document.querySelectorAll('.internal-captain-link').forEach(link=>link.addEventListener('click',e=>{
    e.preventDefault();
    const target=link.dataset.captainTarget;
    currentTab='captains';
    render();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const el=document.getElementById(target);
      if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('focus-flash');setTimeout(()=>el.classList.remove('focus-flash'),1600)}
      try{const u=new URL(location.href);u.searchParams.set('role',currentRole);u.searchParams.set('tab','captains');u.searchParams.set('plan',currentPlan);u.searchParams.set('moments',currentMomentMode);u.hash=target;history.replaceState({},'',u)}catch(_){}
    }));
  }));
  activateTab(currentTab,false);
  if(location.hash&&currentTab==='captains'){requestAnimationFrame(()=>{const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView({block:'center'})})}
}
function populateRoleSelect(){
  const s=$('#roleSelect');s.innerHTML='';ROLE_MODELS.forEach(m=>{const o=document.createElement('option');o.value=m.role;o.textContent=m.role;s.appendChild(o)}); if(!ROLE_MODELS.some(m=>m.role===currentRole))currentRole=ROLE_MODELS[0]?.role||'';s.value=currentRole;
}
function setLiveState(mode,message){
  $('#liveDot').className='dot'+(mode==='error'?' error':'');
  $('#liveBar').classList.toggle('is-error',mode==='error');
  $('#liveText').textContent=message;
  $('#updatedText').textContent=DATA?.meta?.updatedAt?`Sheet read: ${DATA.meta.updatedAt}`:'';
}
function acceptData(payload){
  if(!payload||payload.ok===false) throw new Error(payload?.error||'The data endpoint returned an error.');
  DATA=payload;
  buildModels();
  populateRoleSelect();
  render();
  setLiveState('live','Live from Google Sheet');
}
function showLiveError(message){
  setLiveState('error',message);
  if(!DATA){
    $('#app').innerHTML='<div class="empty" style="margin-top:22px"><strong>Unable to load the live wedding data.</strong><br>Please refresh the page or check the connection. This handbook does not contain a hardcoded schedule copy.</div>';
  }
  $('#refreshBtn').textContent='Refresh';
}
function loadData(){
  $('#refreshBtn').textContent='Refreshing…';
  const api=String(CONFIG.API_URL||'').trim();
  if(!api || api.includes('PASTE_YOUR_')){showLiveError('Apps Script URL is not configured');return}
  const cb='staffHandbookCb_'+Date.now()+'_'+Math.floor(Math.random()*100000); const script=document.createElement('script'); const sep=api.includes('?')?'&':'?'; let done=false;
  const cleanup=()=>{if(script.parentNode)script.remove();try{delete window[cb]}catch(e){window[cb]=undefined}};
  const timer=setTimeout(()=>{if(done)return;done=true;cleanup();showLiveError('Live sheet timed out')},40000);
  window[cb]=payload=>{if(done)return;done=true;clearTimeout(timer);cleanup();try{acceptData(payload)}catch(err){showLiveError('Live sheet error: '+err.message)}finally{$('#refreshBtn').textContent='Refresh'}};
  script.onerror=()=>{if(done)return;done=true;clearTimeout(timer);cleanup();showLiveError('Could not reach Apps Script')};
  script.src=api+sep+'callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(script);
}
$('#roleSelect').addEventListener('change',e=>{currentRole=e.target.value;if(currentRole!=='Coordinator')currentCoordinatorPerson='all';render();scrollTo({top:0,behavior:'smooth'})});
$('#standardBtn').onclick=()=>{currentPlan='Standard';render()};$('#rainBtn').onclick=()=>{currentPlan='Rain';render()};$('#refreshBtn').onclick=loadData;
$('#copyBtn').onclick=async()=>{updateURL();try{await navigator.clipboard.writeText(location.href);$('#copyBtn').textContent='Link copied';setTimeout(()=>$('#copyBtn').textContent='Copy link',1300)}catch(e){prompt('Copy this link:',location.href)}};
loadData();setInterval(()=>{if(!document.hidden)loadData()},CONFIG.AUTO_REFRESH_MS);
</script>
</body>
