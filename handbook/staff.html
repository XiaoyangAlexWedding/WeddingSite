g needs a quick adjustment.","details":""},{"name":"Aditi Singh","eventId":"PA07_CEREMONY","time":"2:30 PM","stage":"Ceremony","location":"Providence","role":"Ceremony Dress Captain","duty":"Help Xiaoyang with her bouquet, train, veil and dress during the ceremony if needed. No need to hover — just step in when an adjustment would help.","details":""},{"name":"Amber Innes","eventId":"PA07_CEREMONY","time":"2:30 PM","stage":"Ceremony","location":"Providence","role":"Ring Boy Captain","duty":"Keep an eye on the Ring Boy after he enters. Please step in if he needs a little help during the ceremony.","details":""},{"name":"Bobby Joachim","eventId":"PA07_CEREMONY","time":"2:30 PM","stage":"Before Ceremony","location":"Providence","role":"Best Man, Ring Keeper, Groomsman","duty":"Please keep the wedding rings with you and secure until they’re needed. Hold onto them until the ceremony handoff.","details":""},{"name":"Bobby Joachim","eventId":"PA07_CEREMONY","time":"2:30 PM","stage":"Ceremony","location":"Providence","role":"Ring Keeper","duty":"Please hand over the wedding rings when they’re called for during the ceremony. Keep them secure until that moment.","details":""},{"name":"Katie Bruno","eventId":"PA07_CEREMONY","time":"2:30 PM","stage":"Ceremony","location":"Providence","role":"Flower Captain","duty":"Keep a casual eye on the bouquets and flowers during the ceremony. Afterward, help collect or redistribute them if needed.","details":""},{"name":"Keith Denivo","eventId":"PA07_CEREMONY","time":"2:30 PM","stage":"Ceremony","location":"Providence","role":"Groomsman, Groom Belongings","duty":"Stay available to Alex during the ceremony if he needs anything. Otherwise, enjoy the ceremony with the rest of the wedding party.","details":""},{"name":"Yu Yao","eventId":"PA07_CEREMONY","time":"2:30 PM","stage":"Ceremony","location":"Providence","role":"Flower Girl Captain","duty":"Keep an eye on the Flower Girl after she enters. Please step in if she needs a little help during olar's courtyard).mov","url":"https://drive.google.com/file/d/1mci091kKJUF1m1Fh_ph8O_dvZOjriA8w/view?usp=drive_link","type":"video"},{"label":"Reception(Hall of Brocade).mp4","url":"https://drive.google.com/file/d/1Z-Txlkw2Mjd-B3kVNnaPrVzY77t3Y2tA/view?usp=sharing","type":"video"},{"label":"Reception+Buffet table(hall ).mov","url":"https://drive.google.com/file/d/19zOuR7sd_A2WSmvG6qs_4BAYMpkJ7LRo/view?usp=drive_link","type":"video"},{"label":"Bar (knowing the fish).mp4","url":"https://drive.google.com/file/d/13N5cuFw52TVReheMV8LoRsPvIDR6KYbL/view?usp=sharing","type":"video"}],"DJ":[{"label":"DJ  DJ scripts for Reception","url":"https://drive.google.com/drive/folders/1uI-cl6kFWiqzQ3jI3Qo_2-y2lO2F8JPF?usp=drive_link","type":"document"},{"label":"DJ (flower's bath).mp4","url":"https://drive.google.com/file/d/1eAMtgkoFJO1XQH6Qh-M6znxsjCP5gPOq/view?usp=drive_link","type":"video"}],"Officiant":[{"label":"Officiant","url":"https://drive.google.com/drive/folders/1sspYKpXOOGjRSK5F5P9yI5jz2C2AXvDF?usp=drive_link","type":"document"}]}}</script>
<script>
const CONFIG = {
  // Paste the /exec URL from the ONE unified Apps Script Web App here.
  // Keep ?handbook=staff at the end. Until then, the page uses the embedded preview snapshot.
  API_URL: 'https://script.google.com/macros/s/AKfycbxnVmZMMlis0Sz3hbmUn5pPKIH0ujjVJy_cUOedtUO5yDCwU93OJ4kX0E9Fl0VmTtXL/exec?handbook=staff',
  FAMILY_PERSON_PARAM: 'person',
  AUTO_REFRESH_MS: 5 * 60 * 1000
};

let DATA = null;
let ROLE_MODELS = [];
let currentPlan = new URLSearchParams(location.search).get('plan') || 'Standard';
let currentRole = new URLSearchParams(location.search).get('role') || '';
let currentTab = new URLSearchParams(location.search).get('tab') || 'timeline';
if(currentTab==='assignments' || currentTab==='master') currentTab='timeline';
const VALID_TABS = ['timeline','additional','docs','captains'];
if(!VALID_TABS.includes(currentTab)) currentTab='timeline';
let currentMomentMode = new URLSearchParams(location.search).get('moments') || 'role';
if(!['role','key','all'].includes(currentMomentMode)) currentMomentMode='role';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
const norm = s => String(s ?? '').trim().toLowerCase();

function minutes(t){
  if(!t) return 99999;
  const s=String(t).trim().toUpperCase();
  if(s.includes('TBD') || s.includes('#REF')) return 99998;
  let m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/);
  if(!m) return 99997;
  let h=+m[1], min=+(m[2]||0); if(m[3]==='PM'&&h!==12)h+=12;if(m[3]==='AM'&&h===12)h=0;return h*60+min;
}
function uniq(items,keyFn){const seen=new Set();return items.filter(x=>{const k=keyFn(x);if(seen.has(k))return false;seen.add(k);return true})}
function categoryForContact(c){
  const a=norm(c.assignment);
  // Match the person's functional role before venue words that may simply appear
  // inside a route/assignment description (for example “DJ at Lan Su”).
  if(/command center|coordinator\s+assistant|coordinator\s+assitant/.test(a)) return 'Coordinator';
  if(/\bdj\b/.test(a)) return 'DJ';
  if(/cater|cheryl/.test(a)) return 'Catering';
  if(/photo/.test(a)) return 'Photographer';
  if(/video/.test(a)) return 'Videographer';
  if(/officiant/.test(a)) return 'Officiant';
  if(/make\s*up|makeup|hair/.test(a)) return 'Hair & Makeup';
  if(/bus|transport/.test(a)) return 'Transportation';
  if(/hotel/.test(a)) return 'Hotel';
  if(/^coordinator\b/.test(a)) return 'Coordinator';
  if(/providence|lan\s*su|lansu|venue/.test(a)) return 'Venue';
  return c.assignment || 'Staff / Vendor';
}
function roleSort(a,b){
  const order=['Coordinator','Catering','DJ','Photographer','Videographer','Officiant','Venue','Transportation','Hotel','Hair & Makeup'];
  const ai=order.indexOf(a.role), bi=order.indexOf(b.role);
  if(ai!==-1||bi!==-1) return (ai===-1?999:ai)-(bi===-1?999:bi);
  return a.role.localeCompare(b.role);
}
function parseSourceRef(source){
  const m=String(source||'').match(/Master Timeline!([A-Z]+)(\d+)/i); if(!m)return null;
  const col=m[1].toUpperCase(), row=+m[2];
  return {row, plan: col.charCodeAt(0)>=74?'Rain':'Standard'};
}
function masterMatchesDirectory(role,e){
  const text=norm([e.family,e.vendor,e.guest,e.key].filter(Boolean).join(' '));
  if(role==='Transportation') return /shuttle|transport|bus/.test(text);
  if(role==='Hotel') return /hotel/.test(text);
  if(role==='Hair & Makeup') return /makeup|hair|touch[- ]?up/.test(text);
  if(role==='Venue') return /providence|lan su|lansu|garden|chapel/.test(text);
  return false;
}
function isOperationalFamilyRole(r){
  const s=norm(r.role+' '+r.duty);
  return /captain|support|greeter|wrangler|keeper|monitor|usher|toast-giver|reader|food|belongings|music|recording|game|tea ceremony|transport|dress|attire|flower|ring boy|flower girl/.test(s);
}
function buildModels(){
  const map=new Map();
  const ensure=role=>{if(!map.has(role))map.set(role,{role,people:[],tasks:[],master:[],collaborators:[],additional:[],docs:[]});return map.get(role)};
  const contactByName=new Map((DATA.staffContacts||[]).map(c=>[norm(c.name),c]));

  (DATA.staffContacts||[]).forEach(c=>{
    const role=categoryForContact(c); const m=ensure(role);
    if(!m.people.some(p=>norm(p.name)===norm(c.name))) m.people.push(c);
  });
  (DATA.tasks||[]).forEach(t=>{
    const role=t.role||'Staff / Vendor', m=ensure(role); m.tasks.push(t);
    if(t.name && !m.people.some(p=>norm(p.name)===norm(t.name))){
      m.people.push(contactByName.get(norm(t.name)) || {name:t.name,assignment:role,phone:'',email:'',food:''});
    }
  });

  map.forEach(m=>{
    const docMap=DATA.docDetails||{};
    m.docs=Object.keys(docMap).filter(k=>norm(k)===norm(m.role)).flatMap(k=>docMap[k]||[]);
    m.docs=uniq(m.docs,d=>[d.label,d.url].join('|'));
    const eventIds=new Set(m.tasks.map(t=>t.eventId).filter(Boolean));
    const sourceRefs=m.tasks.map(t=>parseSourceRef(t.source)).filter(Boolean);
    m.master=(DATA.masterEvents||[]).filter(e=>{
      const exact=sourceRefs.some(r=>r.row===e.row && r.plan===e.plan);
      const byEvent=e.eventId && eventIds.has(e.eventId);
      return exact || byEvent || (!m.tasks.length && masterMatchesDirectory(m.role,e));
    });
    m.master=uniq(m.master,e=>[e.row,e.plan,e.eventId,e.time].join('|'));

    if(eventIds.size){
      m.collaborators=(DATA.familyRoles||[]).filter(r=>eventIds.has(r.eventId) && isOperationalFamilyRole(r));
      m.collaborators=uniq(m.collaborators,r=>[r.name,r.eventId,r.role,r.duty].join('|'));
    }

    const roleText=norm(m.role);
    if(/photo|video/.test(roleText) || (m.role==='Coordinator' && m.tasks.some(t=>/^PA0?9|PHOTO/i.test(t.eventId||'')))){
      if((DATA.photoTimeline||[]).length) m.additional.push({type:'photo',title:'Photo Timeline',items:DATA.photoTimeline});
    }
    if(/makeup|hair/.test(roleText)){
      if((DATA.makeupTimeline||[]).length) m.additional.push({type:'makeup',title:'Hair & Makeup Timeline',items:DATA.makeupTimeline});
    }
  });
  ROLE_MODELS=[...map.values()].sort(roleSort);
}
function taskVisible(t){
  if(currentPlan==='Standard') return !t.plan || t.plan==='Standard';
  if(t.plan==='Rain') return true;
  return t.plan==='Standard' && !/lan su/i.test(t.venue||'');
}
function masterVisible(e){
  if(currentPlan==='Standard') return e.plan==='Standard';
  if(/^PA|^RS/i.test(e.eventId||'')) return e.plan==='Standard';
  return e.plan==='Rain';
}
function badgeClass(status){return /^confirmed$/i.test(String(status||'').trim())?'confirmed':(/gap|confirm|clarification|wip/i.test(status||'')?'open':'')}
function taskTitle(t){return (t.duty||'').split('\n')[0] || t.role || 'Assignment'}
function updateURL(){
  const u=new URL(location.href);u.searchParams.set('role',currentRole);u.searchParams.set('plan',currentPlan);u.searchParams.set('tab',currentTab);u.searchParams.set('moments',currentMomentMode);history.replaceState({},'',u);
}
function activateTab(tab,scrollIntoView=false){
  currentTab=VALID_TABS.includes(tab)?tab:'timeline';
  document.querySelectorAll('.tab-btn').forEach(btn=>{const on=btn.dataset.tab===currentTab;btn.classList.toggle('active',on);btn.setAttribute('aria-selected',on?'true':'false');btn.tabIndex=on?0:-1});
  document.querySelectorAll('.tab-panel').forEach(panel=>panel.classList.toggle('active',panel.dataset.panel===currentTab));
  updateURL();
  if(scrollIntoView){const bar=document.querySelector('.tabbar');if(bar)bar.scrollIntoView({behavior:'smooth',block:'start'})}
}
function familyLink(name){
  try{const u=new URL(DATA.meta?.familyHandbookUrl||'https://xiaoyangalex.wedding/handbook/');u.searchParams.set(CONFIG.FAMILY_PERSON_PARAM,name);return u.toString()}catch(e){return DATA.meta?.familyHandbookUrl||'#'}
}
function collaboratorsForEvent(eventId){
  if(!eventId) return [];
  return uniq(
    (DATA.familyRoles||[]).filter(r=>r.eventId===eventId && isOperationalFamilyRole(r)),
    r=>[r.name,r.eventId,r.role,r.duty].join('|')
  ).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')) || String(a.role||'').localeCompare(String(b.role||'')));
}
function captainAnchor(c){
  const slug=v=>String(v||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return `captain-${slug(c?.name||'person')}-${slug(c?.eventId||'event')}`;
}
function captainsTabLink(c){
  try{
    const u=new URL(location.href);
    u.searchParams.set('role',currentRole);
    u.searchParams.set('plan',currentPlan);
    u.searchParams.set('tab','captains');
    u.searchParams.set('moments',currentMomentMode);
    u.hash=captainAnchor(c);
    return u.toString();
  }catch(e){return '#'+captainAnchor(c)}
}
function renderMomentCollaborators(eventId){
  const people=collaboratorsForEvent(eventId);
  if(!people.length) return '';
  return `<div class="moment-collabs"><div class="master-label">Family & Friend captains / collaborators</div><div class="moment-collab-list">${people.map(c=>`<a class="moment-collab-link internal-captain-link" data-captain-target="${esc(captainAnchor(c))}" href="${esc(captainsTabLink(c))}"><span>${esc(c.name)}</span>${c.role?`<span class="moment-collab-role">· ${esc(c.role)}</span>`:''} →</a>`).join('')}</div></div>`;
}
function renderRoleAssignment(t){
  const place=[t.venue,t.location].filter(Boolean).map(esc).join(' · ');
  return `<div class="role-assignment"><div class="role-assignment-top"><span class="role-assignment-person">${esc(t.name||'TBD')}</span><span class="badge ${badgeClass(t.status)}">${esc(t.status||'Status not set')}</span>${t.plan==='Rain'?'<span class="badge rain">Rain</span>':''}</div><div class="role-assignment-duty">${nl(t.duty||'Assignment')}</div>${place?`<div class="role-assignment-meta">📍 ${place}</div>`:''}${t.coupleNotes?`<div class="notes"><b>Couple note</b><br>${nl(t.coupleNotes)}</div>`:''}${t.coordNotes?`<details><summary>Open planning / coordination note</summary><div class="discussion">${nl(t.coordNotes)}</div></details>`:''}</div>`;
}
function taskMatchesMaster(t,e){
  const ref=parseSourceRef(t.source);
  if(ref) return ref.row===e.row && ref.plan===e.plan;
  return !!(t.eventId && e.eventId && t.eventId===e.eventId);
}
function buildMergedTimeline(masterEvents,tasks){
  const used=new Set();
  const items=(masterEvents||[]).map(e=>{
    const attached=[];
    tasks.forEach(t=>{if(taskMatchesMaster(t,e)){attached.push(t);used.add(t)}});
    attached.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')) || (a.row||0)-(b.row||0));
    return {master:e,tasks:attached,time:e.time||attached[0]?.time||'',eventId:e.eventId||attached[0]?.eventId||'',sortRow:e.row||99999};
  });
  const groups=new Map();
  tasks.filter(t=>!used.has(t)).forEach(t=>{
    const key=[t.time||'',t.eventId||'',t.venue||'',t.location||''].join('|');
    if(!groups.has(key)) groups.set(key,{master:null,tasks:[],time:t.time||'',eventId:t.eventId||'',sortRow:t.row||99999});
    groups.get(key).tasks.push(t);
  });
  groups.forEach(g=>{g.tasks.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')) || (a.row||0)-(b.row||0));items.push(g)});
  return items.sort((a,b)=>minutes(a.time)-minutes(b.time) || (a.sortRow||99999)-(b.sortRow||99999) || String(a.eventId||'').localeCompare(String(b.eventId||'')));
}
function renderMergedMoment(item){
  const e=item.master;
  const tasks=item.tasks||[];
  const title=e ? (e.key || (e.family||'').split('\n')[0] || (e.vendor||'').split('\n')[0] || e.eventId || 'Wedding moment') : (taskTitle(tasks[0]||{}) || item.eventId || 'Role assignment');
  const eventId=item.eventId || e?.eventId || tasks[0]?.eventId || 'Timeline';
  const isRole=tasks.length>0;
  const rain=(e?.plan==='Rain') || tasks.some(t=>t.plan==='Rain');
  const assignments=isRole?`<div class="role-assignments"><div class="master-label">${esc(currentRole)} · role assignment${tasks.length===1?'':'s'}</div>${tasks.map(renderRoleAssignment).join('')}</div>`:'';
  const collaborators=isRole?renderMomentCollaborators(eventId):'';
  const master=e?`<div class="master-context"><div class="master-label">Overall wedding moment · Master Timeline</div><div class="context-grid"><div class="context"><b>Wedding party & family</b><div>${nl(e.family||'—')}</div></div><div class="context"><b>Planning team & vendors</b><div>${nl(e.vendor||'—')}</div></div><div class="context"><b>Guests</b><div>${nl(e.guest||'—')}</div></div></div>${e.notes?`<div class="notes"><b>Timeline note</b><br>${nl(e.notes)}</div>`:''}</div>`:'';
  return `<article class="event ${isRole?'role-moment':''}"><div class="event-time">${esc(item.time||'TBD')}</div><div class="event-body"><div class="event-top"><span class="event-id">${esc(eventId)}</span>${isRole?'<span class="badge confirmed">Role moment</span>':'<span class="badge">Overall moment</span>'}${rain?'<span class="badge rain">Rain</span>':''}${e?'<span class="badge source">Master Timeline</span>':''}${isRole?'<span class="badge owner">Staff Tasks</span>':''}</div><h3>${esc(title)}</h3>${assignments}${collaborators}${master}</div></article>`;
}
function publicKeyText(e){
  if(!e) return '';
  if(String(e.key||'').trim()) return String(e.key).trim();
  if(e.plan==='Rain'){
    const standard=(DATA.masterEvents||[]).find(x=>x.plan==='Standard' && x.eventId===e.eventId && String(x.key||'').trim());
    if(standard) return String(standard.key).trim();
  }
  return '';
}
function publicVenue(e){
  const id=String(e?.eventId||'').toUpperCase();
  if(id.startsWith('PA')) return 'Providence';
  if(id.startsWith('LS')) return 'Lan Su';
  return '';
}
function renderKeyMoment(item){
  const e=item.master||item;
  const key=publicKeyText(e);
  const title=(key.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)[0]||e?.guest||e?.eventId||'Wedding moment').replace(/\.$/,'');
  const venue=publicVenue(e);
  return `<article class="event key-public"><div class="event-time">${esc(e?.time||item.time||'TBD')}</div><div class="event-body"><div class="key-public-meta">${venue?`<span>🌿 Enjoy</span><span>·</span><span>${esc(venue)}</span>`:''}</div><h3>${esc(title)}</h3></div></article>`;
}
function renderPerson(p){
  return `<div class="person"><div class="person-name">${esc(p.name)}</div>${p.assignment?`<div class="person-role">${nl(p.assignment)}</div>`:''}<div class="person-meta">${p.phone?esc(p.phone):''}${p.phone&&p.email?' · ':''}${p.email?`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:''}</div>${p.food?`<div class="person-food">Food: ${esc(p.food)}</div>`:''}</div>`;
}
function renderCollab(c){
  return `<div class="card collab" id="${esc(captainAnchor(c))}"><div class="collab-name">${esc(c.name)}</div><div class="collab-role">${esc(c.role)}</div><div class="collab-meta">${esc(c.time||'')}${c.stage?' · '+esc(c.stage):''}${c.location?' · '+esc(c.location):''}</div><div class="collab-duty">${nl(c.duty)}</div><div class="collab-links"><a class="pill-link" href="${esc(familyLink(c.name))}" target="_blank" rel="noopener">Open ${esc(c.name)}'s Family handbook ↗</a></div></div>`;
}
function renderDoc(d){
  const isVideo=norm(d.type)==='video' || /\.(mp4|mov|m4v|webm)$/i.test(d.label||'');
  return `<a class="doc-card" href="${esc(d.url)}" target="_blank" rel="noopener"><div class="doc-icon">${isVideo?'▶':'↗'}</div><div class="doc-copy"><b>${esc(d.label||'Reference')}</b><div class="doc-meta">${isVideo?'Video tour':'Detailed document'} · open reference</div></div></a>`;
}
function renderStaffDirectoryContact(c){
  const phone=String(c.phone||'').trim();
  const email=String(c.email||'').trim();
  const phoneHref=phone.replace(/[^+\d]/g,'');
  return `<div class="staff-contact-card"><div class="staff-contact-top"><div><div class="staff-contact-name">${esc(c.name||'Staff / Vendor')}</div><div class="staff-contact-role">${nl(c.assignment||'Staff / Vendor')}</div></div></div><div class="contact-links">${phone?`<a class="contact-link" href="tel:${esc(phoneHref)}">☎ ${esc(phone)}</a>`:''}${email?`<a class="contact-link" href="mailto:${esc(email)}">✉ ${esc(email)}</a>`:''}${!phone&&!email?'<span class="contact-link">Contact not listed</span>':''}</div>${c.food?`<div class="food-note"><b>Food note:</b> ${esc(c.food)}</div>`:''}</div>`;
}
function renderMakeupSchedule(artist,title,items){
  let source=(items||[]);
  // Backward compatibility for an older preview payload that concatenated B:D then G:I
  // without an artist field. A row-number reset marks the start of Lupe's G:I schedule.
  if(source.length && !source.some(i=>i.artist)){
    let current='Ashley', prev=-1;
    source=source.map(i=>{
      const row=Number(i.row||0);
      if(prev>=0 && row && row<prev) current='Lupe';
      prev=row||prev;
      return Object.assign({},i,{artist:current});
    });
  }
  const rows=source.filter(i=>i.artist===artist).sort((a,b)=>(a.row||0)-(b.row||0));
  const body=rows.map(i=>{
    const marker=/^(ARRIVAL|BREAK|TOUCH-UPS|COMPLETION)$/i.test(i.name||'');
    return `<tr><td class="schedule-time">${esc(i.time||'—')}</td><td class="${marker?'schedule-marker':''}">${esc(i.name||'')}</td><td class="schedule-service">${nl(i.service||'')}</td></tr>`;
  }).join('');
  return `<div class="card schedule-card"><div class="schedule-title">${esc(title)}</div><div class="schedule-table-wrap"><table class="schedule-table"><thead><tr><th>Time</th><th>Person / Marker</th><th>Service</th></tr></thead><tbody>${body||'<tr><td colspan="3">No schedule rows found.</td></tr>'}</tbody></table></div></div>`;
}
function renderAdditional(a){
  if(a.type==='photo') return `<div class="card ref-card"><h3>${esc(a.title)}</h3><div class="ref-list">${(a.items||[]).map(i=>`<div class="ref-item"><div class="ref-time">${esc(i.time||'—')}</div><div class="ref-main"><b>${esc(i.flow||i.note||'Photo group')}</b>${i.note&&i.flow?`<div class="ref-note">${nl(i.note)}</div>`:''}${i.names?.length?`<div class="ref-note">${i.names.map(esc).join(' · ')}</div>`:''}</div></div>`).join('')}</div></div>`;
  if(a.type==='makeup') return `<div><div class="makeup-grid">${renderMakeupSchedule('Ashley',"Ashley's Schedule",a.items)}${renderMakeupSchedule('Lupe',"Lupe's Schedule",a.items)}</div><div class="makeup-note">Each table follows its own column order from the Make up Timeline sheet; the two artists are not re-sorted into one combined schedule.</div></div>`;
  return '';
}
function render(){
  if(!ROLE_MODELS.length){$('#app').innerHTML='<div class="empty" style="margin-top:22px">No staff roles were found.</div>';return}
  let model=ROLE_MODELS.find(x=>x.role===currentRole)||ROLE_MODELS[0]; currentRole=model.role;
  $('#roleSelect').value=currentRole; $('#standardBtn').classList.toggle('active',currentPlan==='Standard'); $('#rainBtn').classList.toggle('active',currentPlan==='Rain');
  const tasks=model.tasks.filter(taskVisible).sort((a,b)=>minutes(a.time)-minutes(b.time)||String(a.name||'').localeCompare(String(b.name||''))||(a.row||0)-(b.row||0));
  const roleMasters=model.master.filter(masterVisible).sort((a,b)=>minutes(a.time)-minutes(b.time)||(a.row||0)-(b.row||0));
  const allMasters=(DATA.masterEvents||[]).filter(masterVisible).sort((a,b)=>minutes(a.time)-minutes(b.time)||(a.row||0)-(b.row||0));
  const roleTimeline=buildMergedTimeline(roleMasters,tasks);
  const allTimeline=buildMergedTimeline(allMasters,tasks);
  const keyMasters=allMasters.filter(e=>publicKeyText(e));
  const keyTimeline=buildMergedTimeline(keyMasters,[]).filter(item=>item.master && publicKeyText(item.master));
  const timeline=currentMomentMode==='all'?allTimeline:(currentMomentMode==='key'?keyTimeline:roleTimeline);
  const hasRain=model.tasks.some(t=>t.plan==='Rain') || model.master.some(e=>e.plan==='Rain'); $('#rainBtn').style.display=hasRain?'':'none';
  const venues=[...new Set(tasks.map(t=>t.venue).filter(Boolean))];
  const tags=[`<span class="tag">${tasks.length} assignment${tasks.length===1?'':'s'}</span>`,`<span class="tag gold">${model.people.length} staff contact${model.people.length===1?'':'s'}</span>`]; venues.slice(0,2).forEach(v=>tags.push(`<span class="tag gold">${esc(v)}</span>`));
  const additionalCount=(model.additional||[]).reduce((n,a)=>n+(a.items?.length||0),0);
  const hasAdditional=(model.additional||[]).length>0 && additionalCount>0;
  if(!hasAdditional && currentTab==='additional') currentTab='timeline';
  document.title=`${model.role} · Wedding Staff Handbook`;
  $('#app').innerHTML=`
    <section class="profile"><div class="card profile-main"><div class="eyebrow">Role day-of guide</div><h2>${esc(model.role)}</h2><div class="role-line">Everything this role needs from the live wedding workbook, with the Master Timeline and Staff Tasks merged into one chronological day-of view.</div><div class="tags">${tags.join('')}</div><div class="notice"><strong>${currentPlan} plan.</strong> Confirmed and unresolved items are shown exactly from <b>Staff Tasks</b>; unresolved planning is not silently converted into a final instruction.</div></div><aside class="card team-card"><h3>Role team</h3>${model.people.length?model.people.map(renderPerson).join(''):'<div class="empty">No staff contact is currently mapped to this role.</div>'}</aside></section>

    <nav class="tabbar" role="tablist" aria-label="Staff handbook sections">
      <button class="tab-btn" type="button" role="tab" data-tab="timeline"><span>Day-of Timeline</span><span class="tab-count">${roleTimeline.length}</span></button>
      ${hasAdditional?`<button class="tab-btn" type="button" role="tab" data-tab="additional"><span>Additional Timeline</span><span class="tab-count">${additionalCount}</span></button>`:''}
      <button class="tab-btn" type="button" role="tab" data-tab="docs"><span>Detailed Docs</span><span class="tab-count">${model.docs.length}</span></button>
      <button class="tab-btn" type="button" role="tab" data-tab="captains"><span>${model.role==='Coordinator'?'Captains & Contacts':'Family/Friend Captains'}</span><span class="tab-count">${model.collaborators.length}${model.role==='Coordinator'?' + '+(DATA.staffContacts||[]).length:''}</span></button>
    </nav>

    <div class="tab-panel" data-panel="timeline" role="tabpanel">
      <section class="section"><div class="section-head"><div><div class="section-kicker">One chronological view</div><h2>Day-of timeline + role assignments</h2><div class="section-sub">Master Timeline moments and this role's Staff Tasks are merged by Event ID / linked source row, then ordered by time. When several people in this role work at the same moment, their assignments are grouped together.</div></div></div>
      <div class="timeline-tools"><div class="moment-switch" aria-label="Timeline moment filter"><button type="button" data-moments="role">Role moments only · ${roleTimeline.length}</button><button type="button" data-moments="key">Key moments only · ${keyTimeline.length}</button><button type="button" data-moments="all">Show all moments · ${allTimeline.length}</button></div><div class="timeline-hint">${currentMomentMode==='role'?`Showing moments relevant to ${esc(model.role)}.`:(currentMomentMode==='key'?'Guest-facing key moments only: time, event, and venue. Staff assignments and internal notes are hidden.':'Showing the complete wedding timeline, with this role highlighted where assigned.')}</div></div>
      <div class="timeline ${currentMomentMode==='key'?'key-public-list':''}">${timeline.length?(currentMomentMode==='key'?timeline.map(renderKeyMoment).join(''):timeline.map(renderMergedMoment).join('')):`<div class="empty">No timeline moments are currently mapped to ${esc(model.role)} for this plan.</div>`}</div></section>
    </div>

    ${hasAdditional?`<div class="tab-panel" data-panel="additional" role="tabpanel">
      <section class="section"><div class="section-head"><div><div class="section-kicker">Role-specific reference</div><h2>Additional timeline</h2><div class="section-sub">Supporting source tabs such as Photo Timeline or Hair & Makeup Timeline are shown here when relevant to this role.</div></div></div>${model.additional.map(renderAdditional).join('')}</section>
    </div>`:''}

    <div class="tab-panel" data-panel="docs" role="tabpanel">
      <section class="section"><div class="section-head"><div><div class="section-kicker">Role reference library</div><h2>Detailed Docs</h2><div class="section-sub">Live references from the <b>Doc Details</b> tab for this staff role, separated into working documents and venue / setup video tours.</div></div></div>
      ${(()=>{
        const documents=(model.docs||[]).filter(d=>!(norm(d.type)==='video' || /\.(mp4|mov|m4v|webm)$/i.test(d.label||'')));
        const videos=(model.docs||[]).filter(d=>norm(d.type)==='video' || /\.(mp4|mov|m4v|webm)$/i.test(d.label||''));
        return `<div class="doc-library-grid">
          <div class="doc-frame"><div class="doc-frame-head"><div><h3 class="doc-frame-title">Detailed Documents</h3><div class="doc-frame-sub">Layouts, scripts, guides, and other role references.</div></div><span class="doc-frame-count">${documents.length}</span></div><div class="doc-grid">${documents.length?documents.map(renderDoc).join(''):`<div class="empty">No detailed documents are currently mapped to ${esc(model.role)}.</div>`}</div></div>
          <div class="doc-frame"><div class="doc-frame-head"><div><h3 class="doc-frame-title">Video Tours</h3><div class="doc-frame-sub">Venue, setup, and location walkthrough videos.</div></div><span class="doc-frame-count">${videos.length}</span></div><div class="doc-grid">${videos.length?videos.map(renderDoc).join(''):`<div class="empty">No video tours are currently mapped to ${esc(model.role)}.</div>`}</div></div>
        </div>`;
      })()}
      </section>
    </div>

    <div class="tab-panel" data-panel="captains" role="tabpanel">
      <section class="section"><div class="section-head"><div><div class="section-kicker">Human handoffs</div><h2>${model.role==='Coordinator'?'Captains & staff/vendor contacts':'Family & Friend captains / collaborators'}</h2><div class="section-sub">${model.role==='Coordinator'?'Coordinator command-center view: Family & Friend handoffs plus every staff/vendor contact from Groups&Contact.':'Operational Family & Friend roles sharing this team\'s Event IDs. Role-moment names jump here to the matching captain card.'}</div></div></div>
      ${model.role==='Coordinator'?`<div class="handoff-grid"><div class="handoff-box"><h3 class="handoff-box-title">Family & Friend Captains</h3><p class="handoff-box-sub">People coordinating guest/family execution with the coordinator team.</p><div class="collab-grid">${model.collaborators.length?model.collaborators.map(renderCollab).join(''):`<div class="empty">No Family & Friend captain/collaborator is currently linked to Coordinator Event IDs.</div>`}</div></div><div class="handoff-box"><h3 class="handoff-box-title">All Staff / Vendor Contacts</h3><p class="handoff-box-sub">Live directory from Groups&Contact for day-of vendor communication.</p><div class="staff-directory">${(DATA.staffContacts||[]).length?[...(DATA.staffContacts||[])].sort((a,b)=>categoryForContact(a).localeCompare(categoryForContact(b))||String(a.name||'').localeCompare(String(b.name||''))).map(renderStaffDirectoryContact).join(''):`<div class="empty">No staff contacts found in Groups&Contact.</div>`}</div></div></div>`:`<div class="collab-grid">${model.collaborators.length?model.collaborators.map(renderCollab).join(''):`<div class="empty">No Family & Friend captain/collaborator is currently linked to this role's Event IDs.</div>`}</div>`}
      </section>
    </div>

    <footer class="source-footer">Live source: <strong>${esc(DATA.meta?.source||'Agenda- All in 1')}</strong> · Master Timeline · Staff Tasks · Roles · Groups&Contact · Doc Details · Make up Timeline · Photo Timeline.<br>Change the Google Sheet first; this page refreshes the data instead of maintaining a second schedule.</footer>`;

  document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>activateTab(btn.dataset.tab,true)));
  document.querySelectorAll('[data-moments]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.moments===currentMomentMode);btn.addEventListener('click',()=>{currentMomentMode=btn.dataset.moments;render()})});
  document.querySelectorAll('.internal-captain-link').forEach(link=>link.addEventListener('click',e=>{
    e.preventDefault();
    const target=link.dataset.captainTarget;
    activateTab('captains',false);
    requestAnimationFrame(()=>{
      const el=document.getElementById(target);
      if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('focus-flash');setTimeout(()=>el.classList.remove('focus-flash'),1600)}
      try{history.replaceState({},'',captainsTabLink({name:'',eventId:''}).split('#')[0]+'#'+target)}catch(_){}
    });
  }));
  activateTab(currentTab,false);
  if(location.hash && currentTab==='captains'){requestAnimationFrame(()=>{const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView({block:'center'})})}
}
function populateRoleSelect(){
  const s=$('#roleSelect');s.innerHTML='';ROLE_MODELS.forEach(m=>{const o=document.createElement('option');o.value=m.role;o.textContent=`${m.role} (${m.people.length})`;s.appendChild(o)}); if(!ROLE_MODELS.some(m=>m.role===currentRole))currentRole=ROLE_MODELS[0]?.role||'';s.value=currentRole;
}
function setLiveState(mode,message){
  $('#liveDot').className='dot'+(mode==='preview'?' preview':mode==='error'?' error':'');$('#liveText').textContent=message;$('#updatedText').textContent=DATA?.meta?.updatedAt?`Sheet read: ${DATA.meta.updatedAt}`:'';
}
function acceptData(payload,mode){
  if(!payload||payload.ok===false) throw new Error(payload?.error||'The data endpoint returned an error.'); DATA=payload;buildModels();populateRoleSelect();render();setLiveState(mode,mode==='live'?'Live from Google Sheet':'Preview mode · connect Apps Script URL for live updates');
}
function loadPreview(reason){
  const p=JSON.parse(document.getElementById('preview-data').textContent);acceptData(p,'preview'); if(reason)$('#updatedText').textContent=reason;
}
function loadData(){
  $('#refreshBtn').textContent='Refreshing…';
  const api=String(CONFIG.API_URL||'').trim();
  if(!api || api.includes('PASTE_YOUR_')){loadPreview('Preview snapshot · API URL not configured');$('#refreshBtn').textContent='Refresh sheet';return}
  const cb='staffHandbookCb_'+Date.now()+'_'+Math.floor(Math.random()*100000); const script=document.createElement('script'); const sep=api.includes('?')?'&':'?'; let done=false;
  const cleanup=()=>{if(script.parentNode)script.remove();try{delete window[cb]}catch(e){window[cb]=undefined}};
  const timer=setTimeout(()=>{if(done)return;done=true;cleanup();setLiveState('error','Live sheet timed out · showing last loaded data');$('#refreshBtn').textContent='Refresh sheet'},15000);
  window[cb]=payload=>{if(done)return;done=true;clearTimeout(timer);cleanup();try{acceptData(payload,'live')}catch(err){setLiveState('error','Live sheet error: '+err.message)}finally{$('#refreshBtn').textContent='Refresh sheet'}};
  script.onerror=()=>{if(done)return;done=true;clearTimeout(timer);cleanup();setLiveState('error','Could not reach Apps Script · showing last loaded data');$('#refreshBtn').textContent='Refresh sheet'};
  script.src=api+sep+'callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(script);
}
$('#roleSelect').addEventListener('change',e=>{currentRole=e.target.value;render();scrollTo({top:0,behavior:'smooth'})});
$('#standardBtn').onclick=()=>{currentPlan='Standard';render()};$('#rainBtn').onclick=()=>{currentPlan='Rain';render()};$('#refreshBtn').onclick=loadData;
$('#copyBtn').onclick=async()=>{updateURL();try{await navigator.clipboard.writeText(location.href);$('#copyBtn').textContent='Link copied';setTimeout(()=>$('#copyBtn').textContent='Copy role link',1300)}catch(e){prompt('Copy this link:',location.href)}};
loadData();setInterval(()=>{if(!document.hidden)loadData()},CONFIG.AUTO_REFRESH_MS);
</script>
