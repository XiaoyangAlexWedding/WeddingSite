<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>赴宴回执 · RSVP | 晓扬 &amp; Alex</title>
  <meta name="description" content="婚礼答谢宴 · 赴宴回执：北京 12月19日 · 山西忻州 12月11日 · 江苏泰州 12月13日" />
  <link rel="canonical" href="https://xiaoyangalex.wedding/china/rsvp/">

  <link rel="stylesheet" href="../../fonts/fonts.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2210%22 fill=%22%238a4a35%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23fffaf2%22%3E%E5%9B%8D%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="../styles.css?v=31" />

  <style>
    /* Standalone page: clear the fixed nav */
    .rsvp-page { padding-top: 72px; }
    .rsvp-page .rsvp-block iframe { display: block; width: 100%; border: 0; min-height: 600px; }
    .rsvp-help { font-size: 15px; color: var(--ink-soft); margin-top: 28px; }
    @media (max-width: 600px) { .rsvp-page .rsvp-block { padding: 16px 0; } }
  </style>
</head>
<body>
  <!-- Header — matches the site nav, monogram links back home -->
  <nav class="nav scrolled">
    <a class="nav-mono" href="../" aria-label="首页 · Home" style="border-bottom:0;">X &amp; A</a>
    <a href="../" style="border:0; font-size:14px; letter-spacing:0.12em;">返回首页</a>
  </nav>

  <main class="rsvp-page">
    <section id="rsvp" style="background: var(--bg-deep)">
      <div class="shell-narrow">
        <div class="eyebrow" style="text-align:center">Kindly respond</div>
        <h2 class="section-title">RSVP</h2>
        <div class="section-title-cn">赴 宴 回 执</div>

        <div class="rsvp-block">
          <p style="margin-bottom:28px">诚邀您与我们分享新婚的喜悦！请填写以下信息，以便我们提前安排席位。</p>

          <div class="rsvp-embed">
            <iframe id="rsvp-form" title="婚礼答谢宴 · 赴宴回执" loading="eager" width="100%" height="800"
                    frameborder="0" marginheight="0" marginwidth="0"></iframe>
          </div>

          <p class="rsvp-help">
            表单无法显示？<a id="rsvp-direct" href="https://tally.so/r/dbExNr" target="_blank" rel="noopener">在新页面打开</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="shell">
      <div class="footer-monogram">X &amp; A</div>
      <div class="divider"></div>
      <div class="footer-meta" style="margin-top:24px">Xiaoyang Li &nbsp;·&nbsp; Alexander Joachim</div>
      <div class="footer-hash">#XiaoyangAndAlex</div>
      <div class="footer-meta" style="margin-top:32px; font-size:12px">
        <a href="../">Back to the site →</a>
      </div>
    </div>
  </footer>

  <script>
    /* Build the Tally form link. ?city=beijing|shanxi|jiangsu pre-selects a banquet;
       with no city, Beijing is selected. The option text must match the form exactly. */
    (function () {
      var FORM_ID = "dbExNr";
      var OPTIONS = {
        beijing: "北京 · 12月19日（周六）中午",
        shanxi: "山西忻州 · 12月11日（周五）中午",
        jiangsu: "江苏泰州 · 12月13日（周日）中午"
      };
      var m = /[?&]city=([a-z]+)/i.exec(location.search);
      var city = m && OPTIONS[m[1].toLowerCase()] ? m[1].toLowerCase() : "beijing";
      var pre = "preselect=" + encodeURIComponent(OPTIONS[city]);

      document.getElementById("rsvp-direct").href = "https://tally.so/r/" + FORM_ID + "?" + pre;

      var iframe = document.getElementById("rsvp-form");
      iframe.setAttribute("data-tally-src",
        "https://tally.so/embed/" + FORM_ID + "?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1&" + pre);

      /* Tally's loader resizes the frame to fit; if it can't load, show the form anyway */
      var d = document, w = "https://tally.so/widgets/embed.js";
      var v = function () {
        if (typeof Tally !== "undefined") Tally.loadEmbeds();
        else d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function (e) { e.src = e.dataset.tallySrc; });
      };
      if (typeof Tally !== "undefined") v();
      else if (d.querySelector('script[src="' + w + '"]') == null) {
        var s = d.createElement("script");
        s.src = w; s.onload = v; s.onerror = v;
        d.body.appendChild(s);
        /* don't wait forever for the loader on slow networks */
        setTimeout(function () {
          if (typeof Tally === "undefined" && !iframe.src) {
            iframe.src = iframe.getAttribute("data-tally-src");
            iframe.removeAttribute("data-tally-src"); /* so a late loader won't reload it */
          }
        }, 4000);
      }
    })();
  </script>
</body>
</html>
